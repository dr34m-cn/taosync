name: build-api-server

on:
  push:
    branches: [ 'main' ]
    paths: [ 'apiServer/version.txt' ]

permissions:
  contents: read

concurrency:
  group: build-api-server
  cancel-in-progress: true

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read API server version
        id: version
        run: |
          version=$(head -n 1 apiServer/version.txt | tr -d '\r')
          if [[ ! "$version" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "Invalid API server version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: dr34m
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API server
        uses: docker/build-push-action@v6
        with:
          context: ./apiServer
          file: ./apiServer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: dr34m/tao-sync:api-server
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
